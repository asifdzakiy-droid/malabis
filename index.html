<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk Busana</title>
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS Library untuk membaca Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">Katalog Busana</h1>
            <button class="cart-toggle" id="cartToggle">
                <span>Keranjang</span>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <div class="toolbar">
                <select id="categoryFilter" class="form-input">
                    <option value="">Semua Kategori</option>
                </select>
                <select id="sortFilter" class="form-input">
                    <option value="">Urutkan: Default</option>
                    <option value="price-asc">Harga: Rendah ke Tinggi</option>
                    <option value="price-desc">Harga: Tinggi ke Rendah</option>
                </select>
            </div>
            <div id="loadingMessage" class="loading" style="display: none;">Memuat data produk...</div>
            <div class="products-grid" id="productsGrid">
                <!-- Products will be rendered here -->
            </div>
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Keranjang Belanja</h2>
            <button class="cart-close" id="cartClose">&times;</button>
        </div>
        <div class="cart-body" id="cartBody">
            <!-- Cart items will be rendered here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">Rp0</span>
            </div>

            <!-- Stepper: summary (default) and order form (hidden) -->
            <div class="cart-step cart-step-summary" id="cartStepSummary">
                <div style="margin-top:0.75rem; display:flex; flex-direction:column; gap:0.5rem;">
                    <button class="btn btn-primary btn-block" id="proceedBtn">Lanjut ke Pemesanan</button>
                    <button class="btn btn-secondary btn-block" id="clearCartBtn">Kosongkan Keranjang</button>
                </div>
            </div>

            <div class="cart-step cart-step-order" id="cartStepOrder" style="display:none;">
                <div style="margin-top:0.5rem;">
                    <button class="btn btn-secondary" id="backToCartBtn">&larr; Kembali</button>
                </div>

                <div class="cart-section-title">Data Pembeli</div>
                <input type="text" id="buyerName" class="form-input" placeholder="Nama Pembeli *" required>
                <input type="text" id="buyerPhone" class="form-input" placeholder="No. WhatsApp *" required>

                <div class="cart-section-title">Alamat Pengiriman</div>
                <select id="buyerProvince" class="form-input" required>
                    <option value="">Pilih Provinsi *</option>
                </select>
                <select id="buyerCity" class="form-input" disabled required>
                    <option value="">Pilih Kabupaten/Kota *</option>
                </select>
                <select id="buyerDistrict" class="form-input" disabled required>
                    <option value="">Pilih Kecamatan *</option>
                </select>
                <select id="buyerVillage" class="form-input" disabled required>
                    <option value="">Pilih Desa/Kelurahan *</option>
                </select>
                <textarea id="buyerAddressDetail" class="form-input" rows="2" placeholder="Detail Alamat (Nama Jalan, Nomor Rumah, RT/RW, dll) *" required></textarea>

                <input type="text" id="buyerNote" class="form-input" placeholder="Catatan (Opsional)">

                <div style="display:flex;gap:0.5rem;margin-top:0.75rem;">
                    <button class="btn btn-primary btn-block" id="checkoutBtn">Checkout via WhatsApp</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Product Detail Modal -->
    <div class="modal-overlay" id="productModalOverlay" style="display:none"></div>
    <div class="product-modal" id="productModal" aria-hidden="true">
        <div class="product-modal-card">
            <button class="modal-close" id="productModalClose" aria-label="Tutup">&times;</button>
            <div class="modal-grid">
                <div class="modal-media">
                    <img src="" alt="" id="modalImage" class="modal-image">
                </div>
                <div class="modal-body">
                    <div class="modal-code" id="modalCode"></div>
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-price-row">
                        <div class="modal-price" id="modalPrice"></div>
                        <div class="modal-wholesale" id="modalWholesale" aria-hidden="true"></div>
                    </div>
                    <div class="modal-category" id="modalCategory"></div>
                    <p class="modal-description" id="modalDescription"></p>

                    <div class="modal-controls">
                        <div class="qty-group">
                            <button class="qty-btn" id="modalQtyMinus">-</button>
                            <input type="number" id="modalQty" value="1" min="1">
                            <button class="qty-btn" id="modalQtyPlus">+</button>
                        </div>
                        <button class="btn btn-primary" id="modalAddToCart">Tambah ke Keranjang</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Order form is now inside the cart sidebar as a stepper -->

    <script src="app.js"></script>
</body>
</html>
